site_name: GDUPT-s-CheriY
site_url: https://cherui-yang.github.io/   # 修改为你的 Pages 根地址
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式

# 新增 plugins 部分（关键）
plugins:
  - search               # 保留搜索功能
  - autorefs             # 自动链接解析，解决内部链接 404

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js